[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "radiation-agent-backend"
version = "0.3.0"
description = "FastAPI + LangGraph backend: fixed-station data (IoTDB), daily rule-based analysis with LLM explanations and conversations (openGauss), RAG (Milvus + GLM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.36",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Agent
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    # Data stores
    "apache-iotdb>=2.0",
    "pymilvus>=2.6,<2.7",
    "psycopg[binary,pool]>=3.2",
    # Time zones (ANALYSIS_TIMEZONE): Windows has no system zoneinfo database
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.3"]
pdf = ["pypdf>=4.0"]
dev = [
    "aiomqtt>=2.3",
    "pytest>=8.0",
    "anyio>=4.4",
    "ruff>=0.5",
    "milvus-lite>=2.4; sys_platform != 'win32'",  # embedded Milvus for tests
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]
"app/analysis/analyzer.py" = ["E501"]  # Chinese text
"app/analysis/explain.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]
