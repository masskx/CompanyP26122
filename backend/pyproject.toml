[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "industrial-ai"
version = "0.1.0"
description = "Compute-server internal API for predictive maintenance and the knowledge assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "apache-iotdb>=2.0",
]

[project.scripts]
industrial-ai-collector = "industrial_ai.collector.main:main"

[project.optional-dependencies]
# MQTT subscription (COLLECTOR_SOURCE=mqtt) and `industrial-ai-collector publish-sim`.
mqtt = ["aiomqtt>=2.3"]
dev = [
    "aiomqtt>=2.3",
    "pytest>=8.0",
    "anyio>=4.4",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
]
